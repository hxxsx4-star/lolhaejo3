<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}전설이 키우기{% endblock %}</title>
<style>
:root{--bg:#0d0a17;--bg2:#0a0813;--surface:#16112a;--surface2:#1d1636;
--border:rgba(185,165,255,.14);--border2:rgba(205,185,255,.26);
--text:#ece7f7;--dim:#a89ec6;--faint:#7a7196;--gold:#f2c268;--gold2:#d6a13e;
--accent:#927ce8;--teal:#4fd6c8;--red:#e5484d;
--r-서사:#3d8bf0;--r-전설:#e5484d;--r-신화:#a855f7;--r-프레스티지:#f0b73f;--r-고귀:#2fb8a8;--r-초월:#a56bff;}
*{box-sizing:border-box;}
body{margin:0;background:radial-gradient(1100px 560px at 50% -6%,#16112b,transparent 62%),linear-gradient(180deg,var(--bg),var(--bg2));
min-height:100vh;color:var(--text);font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 80px;}
header.top{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--border);margin-bottom:26px;}
.logo{font-weight:900;font-size:20px;background:linear-gradient(100deg,var(--gold),#fff4d6 45%,var(--gold2));
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.top nav{display:flex;gap:8px;margin-left:auto;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:100px;font-weight:800;font-size:14px;
background:var(--surface2);border:1px solid var(--border2);color:var(--text);cursor:pointer;font-family:inherit;}
.btn.gold{background:color-mix(in srgb,var(--gold) 16%,var(--surface));border-color:color-mix(in srgb,var(--gold) 45%,transparent);color:var(--gold);}
.btn.teal{background:color-mix(in srgb,var(--teal) 14%,var(--surface));border-color:color-mix(in srgb,var(--teal) 40%,transparent);color:var(--teal);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.card{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--border);border-radius:16px;padding:18px 20px;}
h2.sec{font-size:20px;font-weight:900;margin:30px 0 14px;display:flex;align-items:center;gap:10px;}
h2.sec .bar{width:6px;height:22px;border-radius:6px;background:var(--gold);}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--surface2);
border:1px solid var(--border2);border-radius:14px;padding:14px 22px;font-size:14px;max-width:88vw;
box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:50;display:none;white-space:pre-line;}
.avatar{width:32px;height:32px;border-radius:50%;}
.faint{color:var(--faint);font-size:13px;}
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="/">✦ 전설이 키우기</a>
    <nav>
      <a class="btn" href="/">🏆 랭킹</a>
      {% if user %}
        <a class="btn teal" href="/me">🐣 내 전설이</a>
        <a class="btn" href="/logout">로그아웃</a>
      {% elif oauth_ready is not defined or oauth_ready %}
        <a class="btn gold" href="/login">디스코드로 로그인</a>
      {% endif %}
    </nav>
  </header>
  {% block content %}{% endblock %}
</div>
<div class="toast" id="toast"></div>
<script>
function toast(msg, ms=2600){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';
clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms);}
async function api(path, body){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  return await r.json();
}
</script>
{% block script %}{% endblock %}
</body>
</html>
